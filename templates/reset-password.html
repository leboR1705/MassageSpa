<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Serafina Spa</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #3d405b;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .page-title {
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
        }

        .page-title h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.8em;
            color: #f7f5f2;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .account-container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .account-container h2 {
            font-family: 'Playfair Display', serif;
            color: #2c5f5d;
            margin-bottom: 20px;
            font-size: 1.6em;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus {
            border-color: #2c5f5d;
            outline: none;
            box-shadow: 0 0 8px rgba(44, 95, 93, 0.2);
        }

        .submit-btn {
            background-color: #2c5f5d;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s ease, transform 0.15s ease;
            margin-bottom: 12px;
            font-family: 'Open Sans', sans-serif;
        }

        .submit-btn:hover {
            background-color: #1e4442;
            transform: translateY(-2px);
        }

        .toggle-link {
            font-size: 0.9em;
            margin-top: 12px;
        }

        .toggle-link a {
            color: #2c5f5d;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        hr {
            margin: 16px 0;
            border: 0;
            border-top: 1px solid #eee;
        }

        @media (max-width: 480px) {
            .account-container {
                padding: 20px 16px;
                max-width: 360px;
            }
            .page-title h1 { font-size: 1.4em; }
            .account-container h2 { font-size: 1.4em; }
        }
    </style>
</head>
<body>
    <main>
        <div class="page-title"><h1>Welcome to Satori Spa</h1></div>
        <div class="account-container">
            {% if success %}
                <h2>Password Reset</h2>
                <p style="color: #2c5f5d; font-weight: 600;">{{ success }}</p>
                <hr>
                <p class="toggle-link">
                    <a href="{% url 'massage_app:login' %}">Back to Login</a>
                </p>
            {% elif error %}
                <h2>Password Reset</h2>
                <p style="color: red; font-weight: 600;">{{ error }}</p>
                <hr>
                <p class="toggle-link">
                    <a href="{% url 'massage_app:login' %}">Back to Login</a>
                </p>
            {% else %}
                <h2>Set New Password</h2>
                <form method="post" action="">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="reset-password">New Password</label>
                        <input type="password" id="reset-password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="reset-confirm-password">Confirm New Password</label>
                        <input type="password" id="reset-confirm-password" name="confirm-password" required>
                    </div>
                    <button type="submit" class="submit-btn">Update Password</button>
                    <hr>
                    <p class="toggle-link">
                        <a href="{% url 'massage_app:login' %}">Back to Login</a>
                    </p>
                </form>
            {% endif %}
        </div>
    </main>
</body>
</html>
